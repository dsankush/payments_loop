<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#eef1e9">
<title>Farmer payments admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<main id="loginView" class="login">
  <form id="loginForm" class="login-inner" autocomplete="off">
    <div id="loginMark"></div>
    <h1>Admin</h1>
    <p class="lede">Enter the admin code to see every sheet and add new numbers.</p>
    <label class="field">
      <span class="field-label">Admin code</span>
      <input id="code" type="password" autocomplete="off" spellcheck="false" required>
    </label>
    <button class="btn btn-primary btn-block" id="loginBtn" type="submit">Log in</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</main>

<div id="appView" class="hidden">
  <header class="bar bar-wide">
    <div class="bar-in">
      <div class="brand"><span id="barMark"></span><b>Farmer payments, admin</b></div>
      <button class="btn btn-quiet btn-small" id="logoutBtn" type="button">Log out</button>
    </div>
  </header>
  <main class="col col-wide">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="overview" type="button">Overview</button>
      <button class="tab" role="tab" data-tab="assign" type="button">Add numbers</button>
      <button class="tab" role="tab" data-tab="export" type="button">Export</button>
    </div>
    <section id="overview" class="section"></section>
    <section id="assign" class="section hidden"></section>
    <section id="export" class="section hidden"></section>
  </main>
</div>

<script src="/common.js"></script>
<script>
(function () {
  const { h, inr, fmtDate, api, store, icon, tally, toast, confirmDialog } = FP;
  const $ = (id) => document.getElementById(id);
  let summary = null;
  let tab = 'overview';

  function show(v) {
    $('loginView').classList.toggle('hidden', v !== 'login');
    $('appView').classList.toggle('hidden', v !== 'app');
  }
  function logout(msg) {
    store.set(null); summary = null; $('code').value = '';
    $('loginErr').textContent = msg || '';
    show('login');
  }
  $('loginMark').append(tally(['paid', 'paid', 'paid', 'paid', 'pending'], { height: 40 }));
  $('barMark').append(tally(['paid', 'paid', 'paid', 'paid', 'paid'], { height: 22 }));
  $('logoutBtn').addEventListener('click', () => logout());

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('loginErr').textContent = '';
    $('loginBtn').disabled = true;
    try {
      const r = await api('/api/login', { method: 'POST', json: { name: 'Admin', code: $('code').value } });
      store.set(r.token);
      await start();
    } catch (err) { $('loginErr').textContent = err.message; }
    finally { $('loginBtn').disabled = false; $('code').value = ''; }
  });

  document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => { tab = b.dataset.tab; renderTabs(); }));
  function renderTabs() {
    document.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    for (const id of ['overview', 'assign', 'export']) $(id).classList.toggle('hidden', id !== tab);
  }

  async function start() {
    try {
      summary = await api('/api/admin/summary');
      show('app');
      renderTabs();
      renderOverview();
      renderAssign();
      renderExport();
    } catch (err) {
      if (err.status === 401) logout(err.message); else toast(err.message);
    }
  }

  // ---------- Overview ----------
  const pct = (a, b) => (b ? (a / b) * 100 : 0);
  function meter(paid, failed, pending) {
    const t = paid + failed + pending;
    return h('div', { class: 'meter', role: 'img', 'aria-label': `${Math.round(pct(paid, t))} percent paid` },
      h('i', { class: 'm-paid', style: `width:${pct(paid, t)}%` }),
      h('i', { class: 'm-failed', style: `width:${pct(failed, t)}%` }),
      h('i', { class: 'm-pending', style: `width:${pct(pending, t)}%` }));
  }

  function renderOverview() {
    const o = summary.overall;
    const toSend = summary.people.reduce((s, p) => s + (p.nextSheet ? p.nextSheet.toSend : 0), 0);
    $('overview').replaceChildren(
      h('h2', {}, `${inr(o.paid)} paid so far`),
      h('p', { class: 'muted' }, `${inr(o.pending + o.failed)} still to pay out of ${inr(o.total)} across ${o.numbers} numbers.`),
      meter(o.paid, o.failed, o.pending),
      h('div', { class: 'legend' },
        h('span', { style: '--c:var(--paddy)' }, `Paid ${inr(o.paid)}`),
        h('span', { style: '--c:var(--chilli)' }, `Failed ${inr(o.failed)}`),
        h('span', { style: '--c:var(--turmeric)' }, `Not yet paid ${inr(o.pending)}`)),

      paidTable(),

      dailyTable(),

      stateTable(),

      h('div', { class: 'section' },
        h('h2', {}, 'Money to send'),
        h('p', { class: 'muted' }, 'For each person’s next unstarted sheet. Money from failed payments is still with them, so it is taken off.'),
        h('ul', { class: 'send-list' }, ...summary.people.map(sendRow)),
        h('div', { class: 'send-total' }, h('span', {}, 'Total to send now'), h('span', { class: 'money' }, inr(toSend)))),

      h('div', { class: 'section' },
        h('h2', {}, 'By person'),
        h('div', {}, ...summary.people.map(personEl))),

      failedBlock(),

      notedBlock()
    );
  }

  // Paid so far, person by person
  function paidTable() {
    const sum = (p, k) => p.sheets.reduce((a, x) => a + x[k], 0);
    const rows = summary.people.map((p) => ({
      name: p.name, paidN: sum(p, 'paidCount'), paid: p.paid, failedN: sum(p, 'failedCount'), failed: p.failed,
      pendN: sum(p, 'pendingCount'), pending: p.pending, numbers: p.numbers, total: p.total,
    }));
    const t = rows.reduce((a, r) => ({ paidN: a.paidN + r.paidN, paid: a.paid + r.paid, failedN: a.failedN + r.failedN, failed: a.failed + r.failed,
      pendN: a.pendN + r.pendN, pending: a.pending + r.pending, numbers: a.numbers + r.numbers, total: a.total + r.total }), { paidN: 0, paid: 0, failedN: 0, failed: 0, pendN: 0, pending: 0, numbers: 0, total: 0 });
    const th = (x, r) => h('th', r ? { class: 'r' } : {}, x);
    const money = (n, cls) => h('td', { class: 'r' + (cls ? ' ' + cls : '') }, inr(n));
    const count = (n, of) => h('td', { class: 'r' }, `${n} of ${of}`);
    return h('div', { class: 'section' },
      h('h2', {}, 'Paid by person'),
      h('p', { class: 'muted' }, 'Successful payments only. Failed and not yet paid amounts are shown next to them.'),
      h('div', { class: 'table-scroll' }, h('table', { class: 'paid-table' },
        h('thead', {}, h('tr', {}, th('Person'), th('Paid numbers', true), th('Paid amount', true), th('Failed', true), th('Not yet paid', true), th('Total', true))),
        h('tbody', {}, ...rows.map((r) => h('tr', {},
          h('td', {}, h('b', {}, r.name)), count(r.paidN, r.numbers), money(r.paid, 'ok'), money(r.failed), money(r.pending), money(r.total)))),
        h('tfoot', {}, h('tr', {},
          h('td', {}, 'All people'), count(t.paidN, t.numbers), money(t.paid, 'ok'), money(t.failed), money(t.pending), money(t.total))))));
  }

  // Paid by calendar day, one column per person
  function dailyTable() {
    const days = summary.daily || [];
    const names = summary.people.map((p) => p.name);
    const dayLabel = (iso) => new Date(iso + 'T12:00:00+05:30').toLocaleDateString('en-IN', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric', timeZone: 'Asia/Kolkata' });
    const th = (x, r) => h('th', r ? { class: 'r' } : {}, x);
    const cell = (v) => h('td', { class: 'r' }, v ? inr(v.amount) : h('span', { class: 'muted' }, '–'));
    if (!days.length) {
      return h('div', { class: 'section' }, h('h2', {}, 'Paid by date'), h('p', { class: 'muted' }, 'No successful payments yet. They appear here day by day as people mark them paid.'));
    }
    const totalBy = {};
    let totalN = 0, totalAmt = 0;
    for (const d of days) {
      totalN += d.count; totalAmt += d.amount;
      for (const n of names) if (d.byPerson[n]) {
        totalBy[n] = totalBy[n] || { count: 0, amount: 0 };
        totalBy[n].count += d.byPerson[n].count; totalBy[n].amount += d.byPerson[n].amount;
      }
    }
    return h('div', { class: 'section' },
      h('h2', {}, 'Paid by date'),
      h('p', { class: 'muted' }, 'Successful payments on each day (India time), split by person.'),
      h('div', { class: 'table-scroll' }, h('table', { class: 'paid-table daily-table' },
        h('thead', {}, h('tr', {}, th('Date'), th('Numbers', true), th('Amount', true), ...names.map((n) => th(n, true)))),
        h('tbody', {}, ...days.map((d) => h('tr', {},
          h('td', {}, h('b', {}, dayLabel(d.date))), h('td', { class: 'r' }, d.count), h('td', { class: 'r ok' }, inr(d.amount)),
          ...names.map((n) => cell(d.byPerson[n]))))),
        h('tfoot', {}, h('tr', {}, h('td', {}, 'All days'), h('td', { class: 'r' }, totalN), h('td', { class: 'r ok' }, inr(totalAmt)), ...names.map((n) => cell(totalBy[n])))))));
  }

  // Paid, failed and pending by state
  function stateTable() {
    const rows = summary.byState || [];
    if (!rows.length) return null;
    const th = (x, r) => h('th', r ? { class: 'r' } : {}, x);
    const money = (n, cls) => h('td', { class: 'r' + (cls ? ' ' + cls : '') }, inr(n));
    const t = rows.reduce((a, r) => ({ numbers: a.numbers + r.numbers, paidCount: a.paidCount + r.paidCount, paid: a.paid + r.paid, failed: a.failed + r.failed, pending: a.pending + r.pending, total: a.total + r.total }),
      { numbers: 0, paidCount: 0, paid: 0, failed: 0, pending: 0, total: 0 });
    const count = (n, of) => h('td', { class: 'r' }, `${n} of ${of}`);
    return h('div', { class: 'section' },
      h('h2', {}, 'Paid by state'),
      h('p', { class: 'muted' }, 'Successful payments for each state, with what is still failed or not yet paid.'),
      h('div', { class: 'table-scroll' }, h('table', { class: 'paid-table' },
        h('thead', {}, h('tr', {}, th('State'), th('Paid numbers', true), th('Paid amount', true), th('Failed', true), th('Not yet paid', true), th('Total', true))),
        h('tbody', {}, ...rows.map((r) => h('tr', {}, h('td', {}, h('b', {}, r.state)), count(r.paidCount, r.numbers), money(r.paid, 'ok'), money(r.failed), money(r.pending), money(r.total)))),
        h('tfoot', {}, h('tr', {}, h('td', {}, 'All states'), count(t.paidCount, t.numbers), money(t.paid, 'ok'), money(t.failed), money(t.pending), money(t.total))))));
  }

  function sendRow(p) {
    const n = p.nextSheet;
    return h('li', { class: 'send-row' },
      h('b', {}, p.name),
      h('span', { class: 'detail' }, n
        ? `Sheet ${n.sheet_no} adds up to ${inr(n.total)}` + (n.carry > 0 ? `, less ${inr(n.carry)} already with ${p.name}` : '')
        : (p.carry > 0 ? `${inr(p.carry)} from failed payments is with ${p.name}. No new sheet to fund.` : 'No new sheet to fund.')),
      h('span', { class: 'money' + (n ? '' : ' none') }, n ? inr(n.toSend) : 'Nothing'));
  }

  function personEl(p) {
    const paidN = p.sheets.reduce((s, x) => s + x.paidCount, 0);
    const failN = p.sheets.reduce((s, x) => s + x.failedCount, 0);
    const pendN = p.sheets.reduce((s, x) => s + x.pendingCount, 0);
    return h('details', { class: 'person' },
      h('summary', {},
        h('span', { class: 'name' }, p.name),
        h('span', { class: 'count' }, `${paidN} of ${p.numbers} paid`),
        h('span', { class: 'chev' }, icon('chevron', 20)),
        meter(paidN, failN, pendN)),
      h('div', { class: 'table-scroll' }, h('table', {},
        h('thead', {}, h('tr', {}, h('th', {}, 'Sheet'), h('th', {}, 'Progress'), h('th', { class: 'r' }, 'Sheet total'),
          h('th', { class: 'r' }, 'Paid'), h('th', { class: 'r' }, 'Failed'), h('th', { class: 'r' }, 'Not yet paid'))),
        h('tbody', {}, ...p.sheets.map((s) => h('tr', {},
          h('td', {}, `Sheet ${s.sheet_no}`),
          h('td', {}, tally([].concat(Array(s.paidCount).fill('paid'), Array(s.failedCount).fill('failed'), Array(s.pendingCount).fill('pending')), { height: 18 })),
          h('td', { class: 'r' }, h('b', {}, inr(s.total))),
          h('td', { class: 'r' }, inr(s.paid)),
          h('td', { class: 'r' }, inr(s.failed)),
          h('td', { class: 'r' }, inr(s.pending))))))),
      p.carry > 0 ? h('p', { class: 'callout' }, `${inr(p.carry)} from failed payments is still with ${p.name}.`) : null);
  }

  function failedBlock() {
    const list = summary.failedList;
    return h('div', { class: 'section' },
      h('h2', {}, 'Failed payments'),
      list.length
        ? [h('p', { class: 'muted' }, 'Each stays in its sheet with the same person until it is paid.'),
           h('div', { class: 'table-scroll' }, h('table', {},
             h('thead', {}, h('tr', {}, h('th', {}, 'Person'), h('th', {}, 'Sheet'), h('th', {}, 'Number'), h('th', {}, 'Farmer'), h('th', {}, 'State'), h('th', {}, 'Products'), h('th', {}, 'Remark'), h('th', {}, 'Tried at'), h('th', { class: 'r' }, 'Amount'))),
             h('tbody', {}, ...list.map((f) => h('tr', {}, h('td', {}, f.person), h('td', {}, `Sheet ${f.sheet_no}`), h('td', {}, f.phone), h('td', {}, f.farmer_name || ''), h('td', {}, f.state || ''), h('td', { style: 'white-space:normal;min-width:180px' }, f.products || ''), h('td', { style: 'white-space:normal;min-width:200px' }, f.remark || ''), h('td', {}, f.at ? fmtDate(f.at) : ''), h('td', { class: 'r' }, inr(f.prize_money)))))))]
        : h('p', { class: 'muted' }, 'No failed payments right now.'));
  }

  // Pending numbers where the person left a note
  function notedBlock() {
    const list = summary.notedList || [];
    if (!list.length) return null;
    return h('div', { class: 'section' },
      h('h2', {}, 'Pending with a remark'),
      h('p', { class: 'muted' }, 'Not paid yet, and the person left a note.'),
      h('div', { class: 'table-scroll' }, h('table', {},
        h('thead', {}, h('tr', {}, h('th', {}, 'Person'), h('th', {}, 'Sheet'), h('th', {}, 'Number'), h('th', {}, 'Farmer'), h('th', {}, 'State'), h('th', {}, 'Remark'), h('th', { class: 'r' }, 'Amount'))),
        h('tbody', {}, ...list.map((f) => h('tr', {}, h('td', {}, f.person), h('td', {}, `Sheet ${f.sheet_no}`), h('td', {}, f.phone), h('td', {}, f.farmer_name || ''), h('td', {}, f.state || ''), h('td', { style: 'white-space:normal;min-width:220px' }, f.remark || ''), h('td', { class: 'r' }, inr(f.prize_money))))))));
  }

  // ---------- Add numbers ----------
  function renderAssign() {
    const names = summary.people.map((p) => p.name);
    const stateByName = {};
    const ta = h('textarea', { placeholder: 'Paste rows copied from your sheet: Phone, Farmer Name, Products Purchased, State. Or just numbers, one per line.', 'aria-label': 'Farmer numbers' });
    const personBoxes = names.map((n) => h('label', { class: 'check' }, h('input', { type: 'checkbox', value: n, 'data-person': n }), n));
    const modeAuto = h('input', { type: 'radio', name: 'mode', value: 'auto', checked: true });
    const modeMan = h('input', { type: 'radio', name: 'mode', value: 'manual' });
    const topUp = h('input', { type: 'checkbox' });
    const counts = h('div', { class: 'counts hidden' }, ...names.map((n) => h('label', {}, n, h('input', { type: 'number', min: '0', step: '1', value: '0', 'data-count': n, inputmode: 'numeric' }))));
    const out = h('div', { 'aria-live': 'polite' });
    const previewBtn = h('button', { class: 'btn btn-quiet', type: 'button' }, 'Check numbers');
    const goBtn = h('button', { class: 'btn btn-primary', type: 'button', disabled: true }, 'Assign numbers');
    const wrap = h('div', {},
      h('h2', {}, 'Add new numbers'),
      h('p', { class: 'muted' }, 'Numbers already in the system, whether paid, pending or failed, are skipped. Every new number gets a random amount from ₹25 to ₹200, in steps of ₹5, when you assign it, and the amount can never change.'),
      h('div', { class: 'step' }, h('h3', {}, '1. Paste the numbers'),
        h('p', { class: 'muted small' }, 'Copy the rows straight from your sheet (columns Phone, Farmer Name, Products Purchased) and paste them here. A plain list of numbers also works; then the person types the farmer name when paying.'), ta),
      h('div', { class: 'step' }, h('h3', {}, '2. Choose who gets them'),
        h('div', { class: 'checks' }, ...personBoxes),
        h('div', { class: 'opt-row' },
          h('label', { class: 'check' }, modeAuto, 'Deal sheets of 15 in turn'),
          h('label', { class: 'check' }, modeMan, 'Choose a count for each person')),
        counts,
        h('div', { class: 'opt-row' }, h('label', { class: 'check' }, topUp, 'Fill each person’s short last sheet first'))),
      h('div', { class: 'step' }, h('h3', {}, '3. Check, then assign'),
        h('div', { class: 'opt-row' }, previewBtn, goBtn), out));
    $('assign').replaceChildren(wrap);

    const picked = () => names.filter((n) => wrap.querySelector(`[data-person="${n}"]`).checked);
    const key = () => JSON.stringify([ta.value, picked(), modeMan.checked, topUp.checked,
      modeMan.checked ? names.map((n) => wrap.querySelector(`[data-count="${n}"]`).value) : null]);
    let previewKey = null;
    const onChange = () => {
      counts.classList.toggle('hidden', !modeMan.checked);
      if (key() !== previewKey) goBtn.disabled = true;
    };
    wrap.addEventListener('input', onChange);
    wrap.addEventListener('change', onChange);

    const payload = (commit) => {
      const c = {};
      for (const n of names) c[n] = Number(wrap.querySelector(`[data-count="${n}"]`).value || 0);
      return { numbers: ta.value, people: picked(), mode: modeMan.checked ? 'manual' : 'auto', counts: c, topUp: topUp.checked, commit };
    };

    previewBtn.addEventListener('click', async () => {
      out.replaceChildren();
      if (!ta.value.trim()) { out.append(h('p', { class: 'err' }, 'Paste some numbers first.')); return; }
      previewBtn.disabled = true;
      try {
        const r = await api('/api/admin/assign', { method: 'POST', json: payload(false) });
        previewKey = key();
        const s = r.summary;
        for (const p of s.people) stateByName[p.name] = p;
        out.append(
          h('p', { class: 'callout good' }, h('b', {}, `${s.newCount} new ${s.newCount === 1 ? 'number' : 'numbers'} can be added.`)),
          h('p', { class: 'muted small' },
            `You pasted ${s.pasted}. ${s.invalidCount} not valid, ${s.duplicatesInPaste} repeated in your list, ${s.alreadyCount} already in the system` +
            (s.alreadyCount ? ` (${s.already.successful} paid, ${s.already.pending} pending, ${s.already.failed} failed).` : '.')),
          s.newCount ? h('p', { class: s.withNames < s.newCount ? 'callout' : 'muted small' },
            `Farmer names found for ${s.withNames} of ${s.newCount}, products for ${s.withProducts} of ${s.newCount}, states for ${s.withStates} of ${s.newCount}.` +
            (s.withNames < s.newCount ? ` ${s.newCount - s.withNames} without a name: the person will type the name when marking those paid.` : '')) : null,
          s.invalidCount ? h('p', { class: 'err small' }, 'Not valid 10-digit mobile numbers: ' + s.invalid.join(', ') + (s.invalidCount > s.invalid.length ? ' and more' : '')) : null);
        if (!r.plan) {
          out.append(h('p', { class: 'callout' }, s.newCount ? 'Tick at least one person to see the split.' : 'There are no new numbers to assign.'));
          return;
        }
        out.append(
          h('h3', { style: 'margin-top:18px' }, 'Planned split'),
          h('div', { class: 'table-scroll' }, h('table', {},
            h('thead', {}, h('tr', {}, h('th', {}, 'Person'), h('th', {}, 'Goes into'))),
            h('tbody', {}, ...Object.entries(r.plan).map(([n, parts]) => h('tr', {},
              h('td', {}, n),
              h('td', { style: 'white-space:normal' }, parts.length ? parts.map((x) => `Sheet ${x.sheet}: ${x.count} (${x.kind})`).join(', ') : 'Nothing')))))),
          r.unassigned ? h('p', { class: 'callout' }, `${r.unassigned} ${r.unassigned === 1 ? 'number' : 'numbers'} will stay unassigned and can be added later.`) : null);
        goBtn.disabled = false;
      } catch (e) {
        if (e.status === 401) { logout(e.message); return; }
        out.append(h('p', { class: 'err' }, e.message));
      } finally { previewBtn.disabled = false; }
    });

    goBtn.addEventListener('click', async () => {
      const ok = await confirmDialog({
        title: 'Assign these numbers?',
        body: ['Each number gets a random amount from ₹25 to ₹200.', 'Amounts can never be changed afterwards.'],
        confirmText: 'Assign numbers',
      });
      if (!ok) return;
      goBtn.disabled = true; previewBtn.disabled = true;
      try {
        const r = await api('/api/admin/assign', { method: 'POST', json: payload(true) });
        ta.value = ''; previewKey = null;
        out.replaceChildren(h('p', { class: 'callout good' },
          h('b', {}, `Assigned ${r.assigned} numbers, ${inr(r.totalPrize)} in total. `),
          Object.entries(r.plan).filter(([, p]) => p.length).map(([n, p]) => `${n}: ` + p.map((x) => `Sheet ${x.sheet} (${x.count})`).join(', ')).join('. ')));
        toast('Numbers assigned');
        summary = await api('/api/admin/summary');
        renderOverview();
      } catch (e) {
        if (e.status === 401) { logout(e.message); return; }
        out.append(h('p', { class: 'err' }, e.message));
      } finally { previewBtn.disabled = false; }
    });
  }

  // ---------- Export ----------
  function renderExport() {
    const msg = h('p', { class: 'err' });
    const btn = h('button', { class: 'btn btn-primary', type: 'button' }, 'Download CSV');
    btn.addEventListener('click', async () => {
      msg.textContent = ''; btn.disabled = true;
      try {
        const r = await api('/api/admin/export', { raw: true });
        const blob = await r.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'farmer-payments.csv';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        toast('Download started');
      } catch (e) { if (e.status === 401) logout(e.message); else msg.textContent = e.message; }
      finally { btn.disabled = false; }
    });
    $('export').replaceChildren(
      h('h2', {}, 'Export everything'),
      h('p', { class: 'muted' }, 'One row for every farmer number: person, sheet, number, prize money, status, transaction ID, date and time, and farmer name. Opens in Excel.'),
      h('div', { class: 'opt-row' }, btn), msg);
  }

  if (store.get()) start(); else show('login');
})();
</script>
