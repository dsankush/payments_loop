<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#eef1e9">
<title>Farmer payments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<main id="loginView" class="login">
  <form id="loginForm" class="login-inner" autocomplete="off">
    <div id="loginMark"></div>
    <h1>Farmer payments</h1>
    <p class="lede">Choose your name, then enter your access code.</p>
    <fieldset class="names">
      <legend>Your name</legend>
      <div class="chips" id="nameChips"></div>
    </fieldset>
    <label class="field">
      <span class="field-label">Access code</span>
      <input id="code" class="code-input" type="password" autocapitalize="characters" autocomplete="off" spellcheck="false" required>
    </label>
    <button class="btn btn-primary btn-block" id="loginBtn" type="submit">Log in</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</main>

<div id="appView" class="hidden">
  <header class="bar bar-board">
    <div class="bar-in">
      <div class="brand"><span id="barMark"></span><div><b>Farmer payments</b><div class="who" id="who"></div></div></div>
      <button class="btn btn-quiet btn-small" id="logoutBtn" type="button">Log out</button>
    </div>
  </header>
  <main class="col col-board">
    <section class="band" id="band"></section>
    <div class="toolbar">
      <nav class="sheets" id="tabs" role="tablist" aria-label="Sheets"></nav>
      <div class="seg" id="filter" role="group" aria-label="Show"></div>
    </div>
    <div class="board-head" aria-hidden="true">
      <span>#</span><span>Farmer, state and remark</span><span>Number</span><span>Amount</span><span>Transaction ID</span><span>Date and time</span><span>Result</span>
    </div>
    <ul class="board" id="list"></ul>
    <p class="overall" id="overall"></p>
  </main>
</div>

<script src="/common.js"></script>
<script>
(function () {
  const { h, inr, groupPhone, fmtDate, localNowInput, api, copy, store, icon, tally, toast } = FP;
  const $ = (id) => document.getElementById(id);
  const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const fine = !!(window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches);
  const NAMES = ['Ankita', 'Shreya', 'Dean', 'Saswati', 'Ankush', 'Jeet', 'Nikita'];
  const TXN = /^[A-Za-z0-9]{6,40}$/;

  let data = [];
  let active = null;
  let filter = 'all';
  let drawn = null;
  let drafts = {};          // typed but not yet saved values, kept across redraws
  let armed = null;         // the one Paid button waiting for its second tap
  const autoInputs = new Set();

  const sum = (a) => a.reduce((s, f) => s + f.prize_money, 0);
  const stateOf = (f) => (f.status === 'successful' ? 'paid' : f.status === 'failed' ? 'failed' : 'pending');
  // The corrected-amount entries sit on their own sheet, kept as sheet 0 and shown last.
  const sheetsOf = () => [...new Set(data.map((f) => f.sheet_no))].sort((a, b) => (a || 1e9) - (b || 1e9));
  const sheetName = (s) => (s === 0 ? 'Rectification' : `Sheet ${s}`);
  const rowsOf = (s) => data.filter((f) => f.sheet_no === s).sort((a, b) => a.position - b.position);

  function show(view) {
    $('loginView').classList.toggle('hidden', view !== 'login');
    $('appView').classList.toggle('hidden', view !== 'app');
  }

  function disarm() {
    if (!armed) return;
    clearTimeout(armed.timer);
    armed.btn.classList.remove('armed');
    armed.btn.textContent = 'Paid';
    armed = null;
  }

  // ---------- Login ----------
  $('loginMark').append(tally(['paid', 'paid', 'paid', 'paid', 'pending'], { height: 40 }));
  $('barMark').append(tally(['paid', 'paid', 'paid', 'paid', 'paid'], { height: 22 }));
  NAMES.forEach((n) => $('nameChips').append(
    h('label', { class: 'chip' }, h('input', { type: 'radio', name: 'person', value: n }), h('span', {}, n))
  ));

  function logout(msg) {
    store.set(null);
    data = []; active = null; drawn = null; drafts = {}; disarm();
    $('code').value = '';
    $('loginErr').textContent = msg || '';
    show('login');
  }
  $('logoutBtn').addEventListener('click', () => logout());

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('loginErr').textContent = '';
    const picked = document.querySelector('input[name="person"]:checked');
    if (!picked) { $('loginErr').textContent = 'Choose your name first.'; return; }
    $('loginBtn').disabled = true;
    try {
      const r = await api('/api/login', { method: 'POST', json: { name: picked.value, code: $('code').value } });
      if (r.role !== 'person') throw new Error('Please use the admin page for the admin login.');
      store.set(r.token);
      $('who').textContent = r.name;
      await load();
    } catch (err) {
      $('loginErr').textContent = err.message;
    } finally {
      $('loginBtn').disabled = false;
      $('code').value = '';
    }
  });

  // ---------- Data ----------
  async function load(opts) {
    try {
      const r = await api('/api/my-data');
      data = r.farmers.concat((r.rectifications || []).map((e) => ({ ...e, prize_money: e.amount, sheet_no: 0, kind: 'rectification' })));
      $('who').textContent = r.name;
      const sheets = sheetsOf();
      if (active === null || !sheets.includes(active)) {
        active = sheets.find((s) => rowsOf(s).some((f) => f.status !== 'successful')) || sheets[0] || null;
      }
      show('app');
      render();
      if (opts && opts.focusAfter) focusNext(opts.focusAfter);
    } catch (err) {
      if (err.status === 401) logout(err.message);
      else toast(err.message);
    }
  }

  // After a save, bring the next unpaid number of the same sheet into view.
  function focusNext(prev) {
    const rows = rowsOf(prev.sheet_no).filter((r) => r.status !== 'successful' && r.id !== prev.id);
    const next = rows.find((r) => r.position > prev.position) || rows[0];
    const done = document.querySelector('.rw[data-id="' + prev.id + '"]');
    if (done) { done.classList.add('just'); }
    const el = next && document.querySelector('.rw[data-id="' + next.id + '"]');
    if (!el) return;
    el.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
    if (fine) { const i = el.querySelector('.in-txn'); if (i) i.focus({ preventScroll: true }); }
  }

  // ---------- Render ----------
  function render() {
    disarm();
    autoInputs.clear();
    renderBand();
    renderTabs();
    renderFilter();
    const all = active === null ? [] : rowsOf(active);
    const rows = filter === 'todo' ? all.filter((f) => f.status !== 'successful') : all;
    if (!all.length) {
      $('list').replaceChildren(h('li', { class: 'empty' }, 'No numbers are assigned to you yet. Ask the admin to add a sheet.'));
    } else if (!rows.length) {
      $('list').replaceChildren(h('li', { class: 'empty' }, 'Everything on this sheet is paid.'));
    } else {
      $('list').replaceChildren(...rows.map(rowEl));
    }
    const main = data.filter((f) => !f.kind);
    const rect = data.filter((f) => f.kind);
    const paid = main.filter((f) => f.status === 'successful');
    const failed = main.filter((f) => f.status === 'failed');
    const rectLeft = rect.filter((f) => f.status !== 'successful');
    $('overall').textContent = main.length
      ? `Across all ${sheetsOf().filter((x) => x).length} sheets: ${paid.length} of ${main.length} paid, ${inr(sum(paid))} sent, ${inr(sum(main) - sum(paid))} left` +
        (failed.length ? `, and ${failed.length} failed to retry.` : '.') +
        (rect.length ? ` Rectification: ${rect.length - rectLeft.length} of ${rect.length} paid, ${inr(sum(rectLeft))} left.` : '')
      : '';
  }

  function renderBand() {
    const band = $('band');
    if (active === null) { band.replaceChildren(); return; }
    const rows = rowsOf(active);
    const paid = rows.filter((f) => f.status === 'successful');
    const complete = paid.length === rows.length;
    const animate = !reduce && drawn !== active;
    drawn = active;
    band.replaceChildren(
      h('div', { class: 'band-l' },
        h('div', { class: 'band-title' }, h('h1', {}, sheetName(active)), h('span', { class: 'sub' }, complete ? 'All paid' : `${paid.length} of ${rows.length} paid`)),
        tally(rows.map(stateOf), { height: 40, animate })),
      h('div', { class: 'band-r' },
        h('span', { class: 'big' }, inr(sum(rows) - sum(paid))),
        h('span', { class: 'lbl' }, complete ? 'left on this sheet' : `left to pay, out of ${inr(sum(rows))}`))
    );
  }

  function renderTabs() {
    $('tabs').replaceChildren(...sheetsOf().map((s) => {
      const rows = rowsOf(s);
      const done = rows.filter((f) => f.status === 'successful').length;
      return h('button', {
        class: 'sheet-chip', role: 'tab', type: 'button', 'aria-selected': String(s === active),
        onclick: () => { active = s; render(); },
      }, sheetName(s), done === rows.length ? icon('check', 16) : h('small', {}, `${done}/${rows.length}`));
    }));
  }

  function renderFilter() {
    const all = active === null ? [] : rowsOf(active);
    const todo = all.filter((f) => f.status !== 'successful').length;
    const btn = (key, label) => h('button', { type: 'button', 'aria-pressed': String(filter === key), onclick: () => { filter = key; render(); } }, label);
    $('filter').replaceChildren(btn('all', `All ${all.length}`), btn('todo', `To do ${todo}`));
  }

  function copyBtn(cls, text, value, fmt) {
    const b = h('button', { class: cls, type: 'button', 'aria-label': 'Copy ' + text }, h('span', { class: 'lbl' }, fmt), icon('copy', 18));
    b.addEventListener('click', () => copy(value, b));
    return b;
  }

  function rowEl(f) {
    const st = stateOf(f);
    const li = h('li', { class: 'rw', 'data-state': st, 'data-id': f.id });
    const who = h('div', { class: 'c-who' },
      h('span', { class: 'nm' }, f.farmer_name || 'Name not provided'),
      f.state ? h('span', { class: 'st' }, f.state) : null,
      f.products ? h('span', { class: 'prod' }, f.products) : null,
      f.kind ? h('span', { class: 'tag tag-rect' }, `Corrected amount. ${inr(f.paid_before)} was paid earlier`) : null,
      st === 'failed' ? h('span', { class: 'tag' }, 'Failed earlier. Try again') : null);

    if (st === 'paid') {
      li.append(
        h('span', { class: 'c-pos' }, f.position), who,
        h('div', { class: 'c-num' }, h('span', { class: 'plain-num' }, groupPhone(f.phone))),
        h('div', { class: 'c-amt' }, h('span', { class: 'plain-amt' }, inr(f.prize_money))),
        h('div', { class: 'c-txn' }, h('div', { class: 'paid-facts' }, h('span', {}, 'Transaction ID'), h('b', {}, f.transaction_id))),
        h('div', { class: 'c-time' }, h('div', { class: 'paid-facts' }, h('span', {}, 'Paid on'), h('b', {}, fmtDate(f.paid_at)))),
        h('div', { class: 'c-act' }, h('span', { class: 'paid-flag' }, h('span', { class: 'state', 'data-state': 'paid' }, icon('check', 16)), 'Paid, locked')));
      return li;
    }

    // ----- a number still to pay (or to retry) -----
    const d = drafts[f.id] || (drafts[f.id] = { txn: '', nm: '', dt: '', auto: true, rm: f.remark || '' });
    const needName = !f.farmer_name;
    const err = h('p', { class: 'row-err', role: 'alert' });

    const txn = h('input', { class: 'in-txn', type: 'text', autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', maxlength: '40', placeholder: 'Transaction ID', 'aria-label': 'Transaction ID for ' + groupPhone(f.phone), value: d.txn });
    const nm = needName ? h('input', { class: 'name-in', type: 'text', autocomplete: 'off', maxlength: '80', placeholder: 'Type the farmer name', 'aria-label': 'Farmer name', value: d.nm }) : null;
    if (nm) who.append(nm);
    const rm = h('input', { class: 'rm-in', type: 'text', autocomplete: 'off', maxlength: '200', placeholder: 'Remark (reason if failed)', 'aria-label': 'Remark for ' + groupPhone(f.phone), value: d.rm });
    who.append(rm);

    const dt = h('input', { type: 'datetime-local', 'aria-label': 'Date and time', max: localNowInput(), value: d.auto || !d.dt ? localNowInput() : d.dt });
    const tmeta = h('div', { class: 'tmeta' });
    function paintMeta() {
      tmeta.replaceChildren();
      if (d.auto) tmeta.append(h('b', {}, 'Now'), ' (set automatically)');
      else tmeta.append('Custom time ', h('button', { type: 'button', onclick: () => { d.auto = true; dt.value = localNowInput(); dt.max = localNowInput(); paintMeta(); } }, 'Use now'));
    }
    paintMeta();
    if (d.auto) autoInputs.add({ el: dt, d });
    dt.addEventListener('input', () => { d.dt = dt.value; d.auto = false; autoInputs.forEach((x) => { if (x.el === dt) autoInputs.delete(x); }); paintMeta(); sync(); });
    dt.addEventListener('change', () => { if (!dt.value) { d.auto = true; dt.value = localNowInput(); paintMeta(); sync(); } });

    const okBtn = h('button', { class: 'btn btn-primary btn-paid', type: 'button', disabled: true }, 'Paid');
    const badBtn = h('button', { class: 'btn btn-ghost-danger', type: 'button' }, 'Failed');
    const pendBtn = h('button', { class: 'btn btn-pend', type: 'button', title: 'Keep it pending and save the remark' }, 'Pending');

    function valid() {
      const tOk = TXN.test(txn.value.trim());
      const nOk = !needName || nm.value.trim().length >= 2;
      return tOk && nOk && !!dt.value;
    }
    function sync() {
      const t = txn.value.trim();
      txn.setAttribute('aria-invalid', String(!!t && !TXN.test(t)));
      okBtn.disabled = !valid();
      // Pending is useful when the remark changed, or to put a failed number back to pending.
      pendBtn.disabled = !(f.status === 'failed' || rm.value.trim() !== (f.remark || ''));
      if (armed && armed.btn === okBtn) disarm();
      err.textContent = '';
    }
    txn.addEventListener('input', () => { d.txn = txn.value; sync(); });
    txn.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !okBtn.disabled) { e.preventDefault(); okBtn.click(); } });
    if (nm) nm.addEventListener('input', () => { d.nm = nm.value; sync(); });
    rm.addEventListener('input', () => { d.rm = rm.value; rm.removeAttribute('aria-invalid'); sync(); });
    sync();

    function whenIso() {
      return (d.auto || !dt.value) ? new Date().toISOString() : new Date(dt.value).toISOString();
    }
    async function save(status) {
      err.textContent = '';
      if (!d.auto && dt.value && new Date(dt.value).getTime() > Date.now() + 5 * 60 * 1000) {
        err.textContent = 'The date and time cannot be in the future.';
        return;
      }
      okBtn.disabled = true; badBtn.disabled = true; pendBtn.disabled = true;
      try {
        const json = { id: f.id, status };
        if (f.kind) json.kind = f.kind;
        if (status === 'successful') {
          Object.assign(json, { transaction_id: txn.value, farmer_name: nm ? nm.value : undefined, paid_at: whenIso() });
        } else {
          json.remark = rm.value;
          if (status === 'failed') json.paid_at = whenIso();
        }
        await api('/api/update', { method: 'POST', json });
        delete drafts[f.id];
        toast(status === 'successful' ? `Paid ${inr(f.prize_money)} saved` : status === 'failed' ? 'Marked failed, remark saved' : 'Saved as pending');
        await load({ focusAfter: f });
      } catch (e) {
        if (e.status === 401) { logout(e.message); return; }
        badBtn.disabled = false; sync();
        err.textContent = e.message;
      }
    }
    // Paid needs a second tap to confirm, because a paid entry is locked for good.
    okBtn.addEventListener('click', () => {
      if (okBtn.disabled) return;
      if (armed && armed.btn === okBtn) { disarm(); save('successful'); return; }
      disarm();
      okBtn.classList.add('armed');
      okBtn.textContent = `Confirm ${inr(f.prize_money)}`;
      armed = { btn: okBtn, timer: setTimeout(disarm, 4500) };
    });
    badBtn.addEventListener('click', () => {
      disarm();
      if (rm.value.trim().length < 3) {
        rm.setAttribute('aria-invalid', 'true');
        err.textContent = 'Write the reason in the remark box, then tap Failed.';
        rm.focus();
        return;
      }
      save('failed');
    });
    pendBtn.addEventListener('click', () => { disarm(); if (!pendBtn.disabled) save('pending'); });

    li.append(
      h('span', { class: 'c-pos' }, f.position), who,
      h('div', { class: 'c-num' }, copyBtn('numbtn', 'number', f.phone, groupPhone(f.phone))),
      h('div', { class: 'c-amt' }, copyBtn('amtbtn', 'amount', f.prize_money, inr(f.prize_money))),
      h('div', { class: 'c-txn' }, txn),
      h('div', { class: 'c-time' }, dt, tmeta),
      h('div', { class: 'c-act' }, okBtn, badBtn, pendBtn),
      err);
    return li;
  }

  // Keep every automatic time current while the page is open.
  setInterval(() => {
    const now = localNowInput();
    autoInputs.forEach((x) => { if (x.el.isConnected && x.d.auto && document.activeElement !== x.el) { x.el.value = now; x.el.max = now; } });
  }, 15000);

  if (store.get()) load(); else show('login');
})();
</script>
</body>
</html>
